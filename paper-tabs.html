<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".paper-tabs").forEach(group => {
    const items = [...group.querySelectorAll(":scope > .paper-tab")];
    const bar = document.createElement("div");
    bar.className = "paper-tabbar";

    items.forEach(tab => {
      tab.hidden = true;
      const href = tab.dataset.href;
      const el = document.createElement(href ? "a" : "button");
      el.className = "paper-tab-btn";
      el.textContent = tab.dataset.title;

      if (href) {
        el.href = href;
        el.target = "_blank";
        el.rel = "noopener";
      } else {
        el.type = "button";
        el.setAttribute("aria-expanded", "false");
        el.addEventListener("click", () => {
          const opening = tab.hidden;
          items.forEach(t => (t.hidden = true));
          bar.querySelectorAll("button").forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-expanded", "false");
          });
          if (opening) {
            tab.hidden = false;
            el.classList.add("active");
            el.setAttribute("aria-expanded", "true");
          }
        });
      }
      bar.appendChild(el);
    });

    group.prepend(bar);
  });
});
</script>
